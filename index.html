<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CFE7F2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Το νησί">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Το νησί του Τσαλαπετεινού</title>
<script>
var APPV='30';
window.onerror=function(m,src,line){try{var d=document.getElementById('errbox');if(!d){d=document.createElement('div');d.id='errbox';
  d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:9;background:#fff3c4;color:#2E2A4F;border:2px solid #2E2A4F;border-radius:12px;padding:8px 10px;font:13px system-ui,sans-serif';
  (document.body||document.documentElement).appendChild(d)}
  d.textContent='Σφάλμα / Error (v'+APPV+'): '+m+' · line '+line;}catch(e){}};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&family=Noto+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#CFE7F2; --sea:#6FB7B5; --ink:#2E2A4F; --muted:#56526F; --card:#FFFDF6; --line:#2E2A4F;
  --t1:#FFB677; --t2:#9CCB86; --t3:#C9B6E8; --t4:#FFE08A; --t5:#F7A6A0; --tink:#2E2A4F;
  --ok:#5BAE6B; --no:#E07A6A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --sky:#1F2547; --sea:#2C5A6B; --ink:#F5F0E1; --muted:#C4BFDD; --card:#2B2F57; --line:#F5F0E1; }
}
:root[data-theme="dark"]{ --sky:#1F2547; --sea:#2C5A6B; --ink:#F5F0E1; --muted:#C4BFDD; --card:#2B2F57; --line:#F5F0E1; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:Andika,"Noto Sans Arabic",system-ui,sans-serif;font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
[dir=rtl]{font-family:"Noto Sans Arabic",Andika,sans-serif}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 16px 0}
[hidden]{display:none!important}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;min-height:48px}
.stars{margin-left:auto;white-space:nowrap;flex:none;font-weight:700;background:var(--card);padding:6px 14px;border-radius:999px;border:2px solid var(--line)}
.iconbtn{width:48px;height:48px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-size:22px;display:grid;place-items:center}

/* home */
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.hoopoe-wrap{flex:none;width:118px;height:118px;border-radius:50%;background:#FFF3C4;display:grid;place-items:center;border:3px solid var(--line)}
.hoopoe{width:104px;height:104px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
h1{font-family:Grandstander,Andika,sans-serif;font-weight:800;font-size:26px;font-size:clamp(26px,7vw,44px);line-height:1;margin:0;letter-spacing:-.5px}
.hero p{margin:6px 0 0;color:var(--muted);max-width:30ch}
.langs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.langs::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;min-height:44px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--sky)}
.note{font-size:15px;color:var(--muted);margin:0 0 10px;min-height:1em}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:24px}
@media (min-width:600px){.games{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--c);color:var(--tink);border:3px solid #2E2A4F;padding:18px 14px 16px;text-align:left;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile .ico{font-size:44px;line-height:1;margin-bottom:auto}
.tile b{font-family:Grandstander,Andika,sans-serif;font-size:22px;font-weight:800;display:block;margin-top:10px}
.tile span{font-size:15px}
.tile:nth-child(1){--c:var(--t1);border-radius:28px 44px 30px 40px}
.tile:nth-child(2){--c:var(--t2);border-radius:44px 26px 42px 30px}
.tile:nth-child(3){--c:var(--t3);border-radius:32px 40px 26px 46px}
.tile:nth-child(4){--c:var(--t4);border-radius:40px 30px 46px 26px}
.tile:nth-child(5){--c:var(--t5);border-radius:26px 46px 34px 36px}
.tile:nth-child(6){--c:var(--t2);border-radius:38px 28px 44px 32px}
.tile:nth-child(7){--c:var(--t1);border-radius:30px 42px 28px 44px}
.target{font-size:34px;font-size:clamp(34px,9vw,52px);font-weight:700;background:var(--card);border:3px solid var(--line);border-radius:28px;padding:10px 26px;min-width:60%;text-align:center}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:64px}
.slots span{width:46px;height:58px;border-bottom:4px solid var(--line);font-size:36px;font-weight:700;display:grid;place-items:center}
.letters{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:440px}
.letters button{width:60px;height:60px;border-radius:18px;background:var(--t4);color:var(--tink);border:3px solid #2E2A4F;font-size:32px;font-weight:700}
.letters button.used{visibility:hidden}
.letters button.no{animation:shake .4s}
.big-e{font-size:100px;font-size:clamp(100px,28vw,150px);line-height:1.1}
.sum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.sum .grp{display:flex;flex-wrap:wrap;gap:4px;max-width:150px;justify-content:center;font-size:34px;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:8px}
.sum b{font-family:Grandstander,Andika,sans-serif;font-size:44px}
.sea{margin:auto -16px 0;height:70px;flex:none}
.sea svg{display:block;width:100%;height:100%}

/* game */
.gtitle{font-family:Grandstander,Andika,sans-serif;font-weight:800;font-size:22px;font-size:clamp(17px,5.2vw,22px);margin:0;line-height:1.1;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:6px 0;flex:1;max-width:300px}
.dots i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-style:normal;font-size:14px;line-height:1;opacity:.55}
.dots i.now{opacity:1;box-shadow:0 0 0 3px var(--t4)}
.dots i.done{opacity:1;background:var(--t4);border-color:#E3B93C}
.dots i.new{animation:pop .4s}
.dots:empty{display:none}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0 24px}
#game.play .stage>:first-child{margin-top:auto}
#game.play .stage>:last-child{margin-bottom:auto}
#game.play .stage{padding-bottom:9vh}
.hear{width:96px;height:96px;border-radius:50%;background:var(--t4);color:var(--tink);border:3px solid #2E2A4F;font-size:44px}
.prompt{font-family:Grandstander,Andika,sans-serif;font-size:26px;font-weight:800;margin:0;text-align:center;min-height:36px}
.word{font-size:34px;font-size:clamp(34px,9vw,52px);font-weight:700;margin:0;text-align:center;min-height:1.3em}
.opts{display:grid;gap:14px;width:100%;max-width:460px}
.opts.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts>*{min-width:0}
.opts .pic.lett{font-size:min(44px,10vw);overflow-wrap:anywhere}
.pic{aspect-ratio:1;background:var(--card);border:3px solid var(--line);border-radius:30px;font-size:52px;font-size:clamp(52px,15vw,84px);display:grid;place-items:center;transition:transform .15s}
.pic:active{transform:scale(.95)}
.pic.ok{background:var(--ok);border-color:var(--ok)}
.pic.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.num{font-family:Grandstander,Andika,sans-serif;font-size:44px;font-weight:800;color:var(--ink)}
.count-field{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:420px;min-height:120px}
.count-field button{font-size:44px;width:64px;height:64px;border-radius:50%;transition:transform .15s,opacity .2s}
.count-field button.tapped{opacity:.45;transform:scale(.88)}
.shadow{font-size:110px;font-size:clamp(110px,32vw,170px);line-height:1;filter:brightness(0);opacity:.75}
:root[data-theme=dark] .shadow{filter:brightness(0) invert(1)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .shadow{filter:brightness(0) invert(1)}}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:440px}
@media (min-width:560px){.mem{grid-template-columns:repeat(4,1fr)}}
.card{aspect-ratio:3/4;border-radius:18px;border:3px solid #2E2A4F;background:var(--t3);color:var(--tink);font-size:16px;font-weight:700;display:grid;place-items:center;padding:6px;text-align:center;word-break:break-word}
.card .face{display:none}
.card.open,.card.done{background:var(--card);color:var(--ink);border-color:var(--line)}
.card.open .face,.card.done .face{display:block}
.card.open .back,.card.done .back{display:none}
.card .back{font-size:34px}
.card.done{border-color:var(--ok);background:var(--card);background:color-mix(in srgb,var(--ok) 25%,var(--card))}
.card .face.e{font-size:38px}
.learn-card{width:100%;max-width:380px;background:var(--card);border:3px solid var(--line);border-radius:40px 34px 44px 30px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:6px}
.learn-card .big{font-size:110px;font-size:clamp(110px,30vw,150px);line-height:1.1}
.row{display:flex;gap:14px;align-items:center}
.pill{padding:12px 22px;border-radius:999px;border:3px solid var(--line);background:var(--card);font-weight:700;min-height:52px}
.pill.main{background:var(--ink);color:var(--sky)}
.counter{color:var(--muted);font-size:15px}

/* finish */
.finish{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(46,42,79,.35);background:color-mix(in srgb,var(--sky) 85%,transparent);display:grid;place-items:center;padding:24px;z-index:5}
.finish .box{background:var(--card);border:3px solid var(--line);border-radius:44px 36px 48px 32px;padding:26px 22px;text-align:center;max-width:360px;width:100%}
.finish h2{font-family:Grandstander,Andika,sans-serif;font-size:34px;margin:8px 0 4px}
.finish p{margin:0 0 18px;color:var(--muted)}
.rate{font-size:44px;letter-spacing:4px;margin:2px 0 6px;min-height:52px}
.rate span{display:inline-block;animation:spin .5s both}
.rate span:nth-child(2){animation-delay:.25s}.rate span:nth-child(3){animation-delay:.5s}
.rate span.off{filter:grayscale(1);opacity:.3}
.finish .row{justify-content:center;flex-wrap:wrap}
.burst{font-size:42px;letter-spacing:6px}

.ver{text-align:right;margin:0 0 8px;font-size:12px;color:var(--muted);opacity:.7}
#home{position:relative}
.vbtn{min-height:44px;padding:8px 16px;margin:0 0 12px;font-size:16px}
.vbox{max-height:86vh;overflow-y:auto;text-align:left}
.vbox h2{text-align:center;margin-top:0}
.vlist button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:14px;border:2px solid transparent;font-size:16px;min-height:48px}
.vlist button[aria-pressed=true]{border-color:var(--ok);background:rgba(91,174,107,.18)}
.vlist small{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.vhint{font-size:14px;color:var(--muted);margin:12px 0}
.vbox .pill{display:block;margin:0 auto}
.sect{font-family:Grandstander,Andika,sans-serif;font-weight:800;font-size:26px;margin:8px 0 2px}
:root{--guide:#F3DDB8;--ink2:#E0604F}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--guide:#4A4F80;--ink2:#FF8A78}}
:root[data-theme=dark]{--guide:#4A4F80;--ink2:#FF8A78}
.dice{display:flex;gap:16px;justify-content:center}
.die{width:110px;height:110px;background:#fff;border:3px solid #2E2A4F;border-radius:22px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14px;gap:6px}
.die i.on{background:#2E2A4F;border-radius:50%}
.nline{display:flex;gap:4px;width:100%;max-width:520px}
.nline span{flex:1 1 0;min-width:0;height:48px;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:20px;background:var(--card)}
.nline span.gap{background:var(--t4);color:var(--tink);border-width:3px}
.nline span.fill{background:var(--ok);color:#fff;border-color:var(--ok)}
.objs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:360px;font-size:42px;background:var(--card);border:3px solid var(--line);border-radius:28px;padding:14px;min-height:90px}
.inorder{display:flex;gap:18px}
.inorder .pic{width:84px;font-family:Grandstander,Andika,sans-serif;font-size:40px;border-radius:50%;background:transparent;border-color:transparent;color:var(--ink)}
.inorder .pic.ok{background:transparent;border:4px solid var(--ink2);color:var(--ink)}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-family:Grandstander,Andika,sans-serif;font-size:36px;font-weight:800}
.seq span{min-width:52px;height:60px;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:0 6px}
.seq span.gap{background:var(--t4);color:var(--tink);border-width:3px}
.seq.small{font-size:28px;font-family:inherit}
.tracebox{width:78vw;max-width:300px;width:min(300px,78vw);aspect-ratio:1;position:relative;background:var(--card);border:3px solid var(--line);border-radius:32px}
.tracebox canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
#ink{touch-action:none;cursor:crosshair}
/* book chapters */
.tile:nth-child(5n+8){--c:var(--t3);border-radius:34px 42px 28px 44px}
.tile:nth-child(5n+9){--c:var(--t4);border-radius:42px 30px 44px 28px}
.tile:nth-child(5n+10){--c:var(--t5);border-radius:28px 44px 32px 40px}
.tile:nth-child(5n+11){--c:var(--t1);border-radius:44px 28px 40px 32px}
.tile:nth-child(5n+12){--c:var(--t2);border-radius:30px 40px 46px 28px}
.tile.map{grid-column:1/-1;min-height:118px;--c:var(--t4)}
.opt{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:24px;display:grid;place-items:center;padding:8px;transition:transform .15s}
.opt:active{transform:scale(.95)}
.opt.ok{background:var(--ok);border-color:var(--ok)}
.opt.no{animation:shake .4s}
.opts.c1{grid-template-columns:1fr;max-width:340px}
.pic.txt{aspect-ratio:auto;font-size:26px;font-weight:700;padding:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:86vw;max-width:330px;width:min(330px,86vw)}
.grid3>*{aspect-ratio:1}
.grid3 .pic{font-size:34px;font-size:clamp(34px,10vw,54px);border-radius:22px}
.grid3 .mid{background:var(--t4);border:3px solid #2E2A4F;border-radius:22px;display:grid;place-items:center;font-size:38px;font-size:clamp(38px,11vw,60px)}
.shp{display:block}
.board{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;max-width:420px;background:var(--card);border:3px solid var(--line);border-radius:28px;padding:14px}
.trio{display:flex;align-items:flex-end;justify-content:center;gap:14px;width:100%;max-width:460px;min-height:210px}
.trio .opt{min-width:84px;line-height:1.1}
.tower{display:flex!important;flex-direction:column-reverse;gap:3px;padding:10px 14px}
.tower i{display:block;width:46px;height:20px;border:2px solid #2E2A4F;border-radius:5px}
.stack{display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px}
.stack .opt{place-items:center start;padding:14px 30px 14px 14px;min-height:62px}
.pencil{display:block;height:26px;position:relative;background:linear-gradient(#FFE08A 0 50%,#F2C94C 50%);border:2px solid #2E2A4F;border-right:0;border-radius:6px 0 0 6px}
.pencil::after{content:'';position:absolute;right:-22px;top:-2px;width:22px;height:26px;background:#2E2A4F;-webkit-clip-path:polygon(0 0,100% 50%,0 100%);clip-path:polygon(0 0,100% 50%,0 100%)}
.vs{display:flex;gap:14px;justify-content:center;width:100%}
.objs,.grpbtn,.basket,.fobj,.rooms small,.kout{overflow-wrap:anywhere}
.grpbtn{flex:1;max-width:190px;min-height:150px;display:flex!important;flex-wrap:wrap;gap:4px;justify-content:center;align-content:center;font-size:30px}
.nhouse{width:80vw;max-width:300px;width:min(300px,80vw)}
.roof{background:var(--t5);color:var(--tink);-webkit-clip-path:polygon(50% 0,100% 100%,0 100%);clip-path:polygon(50% 0,100% 100%,0 100%);height:96px;display:grid;place-items:end center;padding-bottom:6px;font:800 40px Grandstander,Andika,sans-serif}
.rooms{display:grid;grid-template-columns:1fr 1fr;border:3px solid var(--line);background:var(--card);border-radius:0 0 18px 18px;overflow:hidden}
.rooms>div{min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 44px Grandstander,Andika,sans-serif;padding:6px}
.rooms>div+div{border-left:3px solid var(--line)}
.rooms .gap{background:var(--t4);color:var(--tink)}
.rooms .fill{background:var(--ok);color:#fff}
.rooms small{font:20px/1.2 Andika,sans-serif;display:flex;flex-wrap:wrap;justify-content:center;max-width:130px}
.seq span.fill{background:var(--ok);color:#fff;border-color:var(--ok)}
.objs span{position:relative}
.objs .gone{opacity:.4}
.objs .gone::after{content:'';position:absolute;left:-4px;right:-4px;top:50%;height:5px;background:var(--no);transform:rotate(-35deg);border-radius:3px}
.story{position:relative;max-width:460px;width:100%;background:var(--card);border:3px solid var(--line);border-radius:26px;padding:14px 16px 14px 76px;font-size:21px;min-height:84px}
.story p{margin:0}
.hear.sm{position:absolute;left:10px;top:10px;width:56px;height:56px;font-size:26px}
.blocks{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px;max-width:440px}
.rod{display:flex;flex-direction:column;gap:2px;padding:3px;background:#E8955A;border:2px solid #2E2A4F;border-radius:6px}
.rod i,.ones i{display:block;width:20px;height:13px;background:#FFE08A;border-radius:2px}
.ones{display:flex;flex-wrap:wrap-reverse;gap:3px;width:52px}
.ones i{border:2px solid #2E2A4F;width:22px;height:18px}
.queue{display:flex;gap:4px;align-items:flex-end;justify-content:center;width:100%}
.queue .flag{font-size:26px;font-size:clamp(26px,7vw,40px)}
.queue .opt{font-size:26px;font-size:clamp(26px,7.5vw,44px);padding:4px 2px;border-radius:16px;flex:0 1 64px;min-width:0;line-height:1.1}
.queue small{display:block;font-size:14px;font-weight:700;min-height:18px}
.money{gap:12px;align-items:center}
.coin{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:800 19px Grandstander,Andika,sans-serif;color:#2E2A4F;border:3px solid #2E2A4F}
.coin.c1{background:radial-gradient(circle,#DADDE0 0 56%,#E8C25A 57%)}
.coin.c2{background:radial-gradient(circle,#E8C25A 0 56%,#DADDE0 57%)}

#fx{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:30;overflow:hidden}
.fxp{position:absolute;font-size:24px;line-height:1;animation:fxfly .9s ease-out forwards}
.fxp.dot{width:10px;height:10px;border-radius:3px}
@keyframes fxfly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.toast{pointer-events:none;position:fixed;left:50%;top:14px;transform:translate(-50%,-120px);z-index:31;background:var(--card);color:var(--ink);border:3px solid #2E2A4F;border-radius:22px;padding:10px 18px;font-weight:700;box-shadow:0 5px 0 #2E2A4F;transition:transform .35s;max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.sbig{position:fixed;left:50%;top:40%;z-index:31;font-family:Grandstander,Andika,sans-serif;font-size:40px;font-weight:800;color:#E0604F;text-shadow:0 3px 0 #fff;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
.sbig.on{animation:sbig 1.3s ease-out}
@keyframes sbig{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.boing{animation:pop .35s ease-out}
.stk-new{font-size:18px;font-weight:700;margin:-8px 0 14px}
.stk-new span{display:inline-block;font-size:56px;animation:spin .9s ease-out}
@keyframes spin{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.games.fun{grid-template-columns:repeat(3,1fr);padding-bottom:12px}
.fun .tile{min-height:120px;padding:10px 8px}.fun .tile .ico{font-size:40px}.fun .tile b{font-size:16px}
.fun .tile:nth-child(1){--c:#7EC8E3}.fun .tile:nth-child(2){--c:var(--t5)}.fun .tile:nth-child(3){--c:var(--t3)}
.ghost{opacity:.9;transform:scale(1.1);box-shadow:0 8px 16px rgba(0,0,0,.3)}
.dropok{box-shadow:0 0 0 5px var(--ok)!important}
.stage.dnd .opts [data-v],.stage.dnd .opts [data-n],.stage.dnd .inorder [data-n],.stage.dnd .letters button,.stage.dnd .wtiles button{touch-action:none}
.isl{position:relative;width:100%;max-width:420px;height:0;padding-bottom:100%;max-height:420px;border-radius:32px;border:3px solid #2E2A4F;overflow:hidden;background:linear-gradient(#BFE6FF 0,#BFE6FF 22%,#5BC0DE 22%,#3FA7C9 100%);touch-action:none}
@media (min-width:460px){.isl{padding-bottom:420px}}
.isl .land{position:absolute;left:10%;top:28%;width:80%;height:52%;border-radius:50%;background:#F6D78B;box-shadow:inset 0 -10px 0 #E9C46A}
.isl .land i{position:absolute;left:14%;top:12%;width:72%;height:62%;border-radius:50%;background:#9CCB86}
.isl .sun{position:absolute;left:5%;top:3%;font-size:40px}
.isl .it{position:absolute;font-size:38px;line-height:1;transform:translate(-50%,-50%);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.isl .it.boing{animation:pop2 .35s ease-out}
@keyframes pop2{50%{transform:translate(-50%,-50%) scale(1.35)}}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));grid-gap:8px;gap:8px;width:100%;max-width:440px}
.shop button{border:3px solid #2E2A4F;border-radius:18px;background:var(--card);padding:6px 2px;font-size:32px;line-height:1.1;box-shadow:0 3px 0 #2E2A4F}
.shop button small{display:block;font-size:14px;font-weight:700}
.shop button.poor{opacity:.45}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-gap:10px;gap:10px;width:100%;max-width:560px}
.med{border:3px solid #2E2A4F;border-radius:20px;background:var(--t4);color:var(--tink);padding:10px 8px;text-align:center}
.med span{display:block;font-size:42px}.med b{display:block;font-size:15px}.med small{display:block;font-size:13px;opacity:.8}
.med.no{background:var(--card);color:var(--muted);border-style:dashed}.med.no span{filter:grayscale(1);opacity:.4}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));grid-gap:8px;gap:8px;width:100%;max-width:560px}
.stk{position:relative;aspect-ratio:1;min-height:64px;border-radius:50%;border:3px solid #2E2A4F;background:#FFF3C4;font-size:36px;display:grid;place-items:center}
.stk.no{border-style:dashed;background:var(--card);color:var(--muted);font-size:24px;font-weight:800}
.stk sup{position:absolute;right:-4px;top:-6px;background:#E0604F;color:#fff;border-radius:10px;padding:1px 6px;font-size:13px}
.pcard{width:100%;max-width:560px;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:12px 14px}
.pcard h3{margin:0 0 6px;font-family:Grandstander,Andika,sans-serif}
.pcard ul{margin:4px 0;padding-left:20px}
.nums{display:flex;flex-wrap:wrap;gap:8px}.nums div{flex:1;min-width:90px;text-align:center;background:var(--sky);border-radius:14px;padding:6px}.nums b{display:block;font-size:26px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px}.bars div{flex:1;text-align:center;font-size:12px}.bars i{display:block;background:var(--ok);border-radius:6px 6px 0 0;margin-bottom:2px;min-height:2px}
.abar{height:14px;border-radius:7px;background:var(--sky);overflow:hidden;margin:2px 0 8px}.abar i{display:block;height:100%;background:var(--ok)}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));grid-gap:10px;gap:10px;width:100%;max-width:560px}
.kidc{border:3px solid #2E2A4F;border-radius:22px;background:var(--t4);color:var(--tink);padding:10px;text-align:center;box-shadow:0 4px 0 #2E2A4F}
.kidc span{display:block;font-size:46px}.kidc b{display:block;font-size:17px}.kidc.cur{background:var(--t2);box-shadow:0 0 0 5px var(--ok)}
.avs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.avs button{font-size:32px;width:52px;height:52px;border-radius:50%;border:3px solid transparent;background:var(--card)}.avs button.on{border-color:var(--ok)}
.kname{font:inherit;font-size:20px;padding:10px 14px;border-radius:14px;border:3px solid var(--line);width:100%;max-width:300px;background:var(--card);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.hoopoe,.eye,.chap.lcard.next{animation:none!important}}
.nogap .dots>*,.nogap .slots>*,.nogap .letters>*,.nogap .sum>*,.nogap .sum .grp>*,.nogap .count-field>*,.nogap .nline>*,.nogap .objs>*,.nogap .seq>*,
.nogap .board>*,.nogap .queue>*,.nogap .week>*,.nogap .legend>*,.nogap .blocks>*,.nogap .ones>*,.nogap .grpbtn>*{margin:3px}
.nogap .stage>*,.nogap .stack>*,.nogap .learn-card>*{margin:8px 0}
.nogap .tower>*,.nogap .rod>*{margin:1px 0}
</style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <section id="home">
    <div class="bar"><div class="langs" id="langs" role="group" aria-label="Γλώσσα / Language"><button class="chip" data-lang="el">Ελληνικά</button><button class="chip" data-lang="en">English</button></div><div class="stars" id="starCount" aria-live="polite">⭐ 0</div></div>
    <div class="hero">

      <div>
        <h1>Το νησί του Τσαλαπετεινού</h1>
        <p>Παιχνίδια για ανάγνωση, γραφή και αριθμούς για παιδιά 6 ετών.</p>
      </div>
    </div>

    <button class="pill vbtn" id="who"></button>
    <button class="pill vbtn" id="voiceBtn">🗣️ Φωνή</button>
    <p class="ver" id="ver"></p>
    <div class="cont" id="cont"></div>
    <div class="games fun">
      <button class="tile" data-game="island"><div class="ico">🏝️</div><b>Το νησί μου</b><span>Στόλισέ το με τα ⭐</span></button>
      <button class="tile" data-game="treasure"><div class="ico">🎁</div><b>Ο θησαυρός μου</b><span>Αυτοκόλλητα και μετάλλια</span></button>
      <button class="tile" data-game="parents"><div class="ico">👪</div><b>Για γονείς</b><span>Η πρόοδος του παιδιού</span></button>
    </div>
    <div class="games books">
      <button class="tile bkt" data-game="langmap"><div class="ico">📗</div><b>Το βιβλίο της Γλώσσας</b><span>Γράμματα, λέξεις, ιστορίες – με τη σειρά του βιβλίου</span></button>
      <button class="tile bkt" data-game="map"><div class="ico">📘</div><b>Το βιβλίο των Μαθηματικών</b><span>Όλα τα κεφάλαια, με τη σειρά του βιβλίου</span></button>
    </div>
    <p class="wbh" id="sumWB">Τα τετράδια</p>
    <div class="games books wbs">
      <button class="tile bkt" data-game="wb:wl"><div class="ico">📓</div><b>Τετράδιο Εργασιών Γλώσσας</b><span>Γράφω γράμματα, λέξεις, υπαγόρευση</span></button>
      <button class="tile bkt" data-game="wb:wh"><div class="ico">✍️</div><b>Το τετράδιο της πρώτης μου γραφής</b><span>Γράφω με το δάχτυλο κάθε γράμμα</span></button>
      <button class="tile bkt" data-game="wb:wm"><div class="ico">📒</div><b>Τετράδιο Εργασιών Μαθηματικών</b><span>Γράφω μόνος μου την απάντηση</span></button>
      <button class="tile bkt" data-game="wb:wp"><div class="ico">📙</div><b>Τετράδιο Μαθηματικών</b><span>Φύλλα εργασίας και τεστ για κάθε ενότητα</span></button>
    </div>
    <details class="more" id="moreLang"><summary id="sumLang">Παιχνίδια ανάγνωσης</summary>
    <div class="games">
      <button class="tile" data-game="read"><div class="ico">👀</div><b>Διαβάζω</b><span>Διάβασε τη λέξη, βρες την εικόνα</span></button>
      <button class="tile" data-game="spell"><div class="ico">✏️</div><b>Γράφω τη λέξη</b><span>Φτιάξε τη λέξη γράμμα γράμμα</span></button>
      <button class="tile" data-game="first"><div class="ico" style="font-family:Grandstander,Andika,sans-serif;font-weight:800">Αα</div><b>Το πρώτο γράμμα</b><span>Από ποιο γράμμα αρχίζει;</span></button>
      <button class="tile" data-game="count"><div class="ico">➕</div><b>Μετρώ και προσθέτω</b><span>Μέτρα και βάλε μαζί</span></button>
      <button class="tile" data-game="listen"><div class="ico">👂</div><b>Ακούω</b><span>Άκου τη λέξη, βρες την εικόνα</span></button>
      <button class="tile" data-game="memory"><div class="ico">🃏</div><b>Ζευγάρια</b><span>Ταίριαξε εικόνες και λέξεις</span></button>
      <button class="tile" data-game="learn"><div class="ico">📖</div><b>Το βιβλίο των λέξεων</b><span>Κοίτα, πάτησε, άκου</span></button>
    </div></details>
    <details class="more" id="moreMath"><summary id="sumMath">Παιχνίδια Μαθηματικών</summary>
    <div class="games">
      <button class="tile" data-game="where"><div class="ico">📍</div><b>Πού είναι;</b><span>Πάνω, κάτω, δεξιά, αριστερά</span></button>
      <button class="tile" data-game="shapes"><div class="ico">🔺</div><b>Σχήματα</b><span>Κύκλος, τετράγωνο, τρίγωνο</span></button>
      <button class="tile" data-game="compare"><div class="ico">⚖️</div><b>Σύγκριση</b><span>Περισσότερα, λιγότερα, &gt; &lt; =</span></button>
      <button class="tile" data-game="marbles"><div class="ico">🔵</div><b>Βόλοι</b><span>Μέσα, ανάμεσα, επάνω</span></button>
      <button class="tile" data-game="drum"><div class="ico">🥁</div><b>Ταμπουρίνο</b><span>Πόσες φορές χτύπησε;</span></button>
      <button class="tile" data-game="match"><div class="ico">🐶</div><b>Φτάνουν;</b><span>Περισσότερα, λιγότερα, όσα</span></button>
      <button class="tile" data-game="forms"><div class="ico">✋</div><b>Ίδιο πλήθος</b><span>Ζάρι, πουλάκια, γραμμές</span></button>
      <button class="tile" data-game="abacus"><div class="ico">🔴</div><b>Αριθμητήριο</b><span>Σχηματίζω αριθμούς</span></button>
      <button class="tile" data-game="tally"><div class="ico">✏️</div><b>Γραμμούλες</b><span>Τόσες γραμμές όσα ψάρια</span></button>
      <button class="tile" data-game="fingers"><div class="ico">✌️</div><b>Δάχτυλα</b><span>Πόσα όλα μαζί;</span></button>
      <button class="tile" data-game="frog"><div class="ico">🐸</div><b>Ο βάτραχος</b><span>Πάνω, κάτω, αριστερά, δεξιά</span></button>
      <button class="tile" data-game="order"><div class="ico">📊</div><b>Σειρά</b><span>Από το πιο ψηλό στο πιο χαμηλό</span></button>
      <button class="tile" data-game="makecoins"><div class="ico">💰</div><b>Φτιάχνω ποσά</b><span>Με κέρματα</span></button>
      <button class="tile" data-game="equation"><div class="ico">📝</div><b>Γράφω την πρόσθεση</b><span>Τι θα γράψει ο μαθηματικός;</span></button>
      <button class="tile" data-game="tensones"><div class="ico">🔟</div><b>Δεκάδες και μονάδες</b><span>34 = 3 δεκάδες και 4 μονάδες</span></button>
      <button class="tile" data-game="clock"><div class="ico">🕒</div><b>Το ρολόι</b><span>Τι ώρα είναι;</span></button>
      <button class="tile" data-game="mult"><div class="ico">✖️</div><b>Πολλαπλασιασμός</b><span>Ίσες ομάδες</span></button>
      <button class="tile" data-game="weight"><div class="ico">⚖️</div><b>Η ζυγαριά</b><span>Πιο βαρύ ή πιο ελαφρύ;</span></button>
      <button class="tile" data-game="sizes"><div class="ico">🐘</div><b>Μεγάλο – μικρό</b><span>Ψηλό, κοντό, μακρύ</span></button>
      <button class="tile" data-game="dice"><div class="ico">🎲</div><b>Ζάρια</b><span>Πόσες τελείες έχει;</span></button>
      <button class="tile" data-game="trace"><div class="ico">✍️</div><b>Γράφω τους αριθμούς</b><span>Γράψε με το δάχτυλο</span></button>
      <button class="tile" data-game="circle"><div class="ico">⭕</div><b>Μετρώ και κυκλώνω</b><span>Βρες τον σωστό αριθμό</span></button>
      <button class="tile" data-game="nline"><div class="ico">📏</div><b>Αριθμογραμμή</b><span>Ποιος αριθμός λείπει;</span></button>
      <button class="tile" data-game="split"><div class="ico">🏠</div><b>Το σπίτι των αριθμών</b><span>Το 5 είναι 2 και 3</span></button>
      <button class="tile" data-game="add"><div class="ico">🔢</div><b>Πρόσθεση</b><span>Πόσα κάνουν μαζί;</span></button>
      <button class="tile" data-game="problems"><div class="ico">📝</div><b>Προβλήματα</b><span>Διάβασε και λύσε</span></button>
      <button class="tile" data-game="big"><div class="ico">🔟</div><b>Αριθμοί μέχρι το 50</b><span>Δεκάδες και μονάδες</span></button>
      <button class="tile" data-game="ordinal"><div class="ico">🚩</div><b>Ποιος είναι πρώτος;</b><span>Πρώτο, δεύτερο, τρίτο</span></button>
      <button class="tile" data-game="coins"><div class="ico">💶</div><b>Τα ευρώ</b><span>Μέτρα τα χρήματα</span></button>
      <button class="tile" data-game="lines"><div class="ico">✏️</div><b>Ενώνω τις τελείες</b><span>Χαράζω γραμμές 1, 2, 3</span></button>
      <button class="tile" data-game="pattern"><div class="ico">🔁</div><b>Συνεχίζω</b><span>Με τον ίδιο τρόπο</span></button>
      <button class="tile" data-game="minus"><div class="ico">➖</div><b>Αφαίρεση</b><span>Πόσα μένουν;</span></button>
      <button class="tile" data-game="sign"><div class="ico">❔</div><b>+ ή −;</b><span>Βρες το σωστό σύμβολο</span></button>
      <button class="tile" data-game="calendar"><div class="ico">📅</div><b>Οι μέρες</b><span>Δευτέρα, Τρίτη, Τετάρτη…</span></button>
    </div></details>
  </section>

  <!-- GAME -->
  <section id="game" hidden style="display:flex;flex-direction:column;flex:1">
    <div class="bar">
      <button class="iconbtn" id="back" aria-label="Πίσω στο νησί">🏝️</button>
      <h2 class="gtitle" id="gtitle"></h2>
      <button class="iconbtn rep" id="rep" aria-label="Άκου ξανά">🔊</button>
      <div class="stars" id="starCount2">⭐ 0</div>
    </div>
    <div class="drow"><div class="dots" id="dots" aria-hidden="true"></div><div class="buddy" id="buddy" aria-hidden="true"></div></div>

    <svg viewBox="0 0 400 70" preserveAspectRatio="none"><path d="M0 30 Q50 10 100 30 T200 30 T300 30 T400 30 V70 H0Z" fill="var(--sea)"/><path d="M0 45 Q50 28 100 45 T200 45 T300 45 T400 45 V70 H0Z" fill="var(--sea)" opacity=".6"/></svg>

</div>

<div class="finish" id="vpanel" hidden>
  <div class="box vbox">
    <h2 id="vtitle">Διάλεξε φωνή</h2>
    <div class="vlist" id="vlist"></div>
    <p class="vhint" id="vhint"></p>
    <button class="pill main" id="vclose">OK</button>

      <button class="pill main" id="again">Ξανά</button>

<div id="fx" aria-hidden="true"></div><div class="toast" id="toast" role="status" aria-live="polite"></div><div class="sbig" id="sbig" aria-hidden="true"></div>
<script>
(function(){try{const d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column;row-gap:1px;position:absolute';d.innerHTML='<div></div><div></div>';
  document.body.appendChild(d);if(d.scrollHeight!==1)document.documentElement.classList.add('nogap');d.remove()}catch(e){}})();
/* ---------- content ---------- */
const LANGS=[
 {id:'en',name:'English',tts:'en'},{id:'el',name:'Ελληνικά',tts:'el'},{id:'ar',name:'العربية',tts:'ar',rtl:1},
 {id:'fr',name:'Français',tts:'fr'},{id:'ru',name:'Русский',tts:'ru'},{id:'bg',name:'Български',tts:'bg'},
 {id:'es',name:'Español',tts:'es'},{id:'de',name:'Deutsch',tts:'de'},{id:'it',name:'Italiano',tts:'it'}];
const ORDER=LANGS.map(l=>l.id);
const W=(e,s)=>{const o={e};s.split('|').forEach((w,i)=>o[ORDER[i]]=w);return o};
const WORDS=[
 W('🐱','cat|γάτα|قطة|chat|кошка|котка|gato|Katze|gatto'),
 W('🐶','dog|σκύλος|كلب|chien|собака|куче|perro|Hund|cane'),
 W('🍎','apple|μήλο|تفاحة|pomme|яблоко|ябълка|manzana|Apfel|mela'),
 W('☀️','sun|ήλιος|شمس|soleil|солнце|слънце|sol|Sonne|sole'),
 W('🐟','fish|ψάρι|سمكة|poisson|рыба|риба|pez|Fisch|pesce'),
 W('🐦','bird|πουλί|طائر|oiseau|птица|птица|pájaro|Vogel|uccello'),
 W('🚗','car|αυτοκίνητο|سيارة|voiture|машина|кола|coche|Auto|macchina'),
 W('⚽','ball|μπάλα|كرة|ballon|мяч|топка|pelota|Ball|palla'),
 W('🌼','flower|λουλούδι|زهرة|fleur|цветок|цвете|flor|Blume|fiore'),
 W('🌳','tree|δέντρο|شجرة|arbre|дерево|дърво|árbol|Baum|albero'),
 W('🏠','house|σπίτι|بيت|maison|дом|къща|casa|Haus|casa'),
 W('⭐','star|αστέρι|نجمة|étoile|звезда|звезда|estrella|Stern|stella'),

function traceIn(d,prompt,extra,ask0,onDone,next,M){

  const box=stage().querySelector('.tracebox'),g=$('guide'),k=$('ink'),dpr=Math.min(2,window.devicePixelRatio||1);
  const W=Math.round(box.clientWidth*dpr);[g,k].forEach(c=>{c.width=c.height=W});

  const tol=document.createElement('canvas');tol.width=tol.height=W;const tc=tol.getContext('2d');

    mask=gc.getImageData(0,0,W,W).data;tmask=tc.getImageData(0,0,W,W).data;kc.lineWidth=W*.075*Math.max(sc,.4);
  };
  (document.fonts?document.fonts.load('700 100px Andika',d):Promise.resolve()).then(drawGuide,drawGuide);
  kc.lineCap=kc.lineJoin='round';kc.lineWidth=W*.075;kc.strokeStyle=css('--ink2');

  ptr(k,e=>{down=true;const[x,y]=pt(e);kc.beginPath();kc.moveTo(x,y);kc.lineTo(x+.1,y);kc.stroke()},
    e=>{if(!down)return;const[x,y]=pt(e);kc.lineTo(x,y);kc.stroke()},()=>{down=false});

    for(let i=3;i<ink.length;i+=12){const gm=mask[i]>40,im=ink[i]>40;if(gm){gt++;if(im)cov++}if(im){it++;if(tmask[i]<40)out++}}

/* ch.1 p.13: marbles inside / between / on the lines */
const RR=[{x:12,y:16,w:70,h:88},{x:118,y:16,w:70,h:88}],RAD=30;
const sdBox=(px,py,b)=>{const cx=b.x+b.w/2,cy=b.y+b.h/2,qx=Math.abs(px-cx)-b.w/2+RAD,qy=Math.abs(py-cy)-b.h/2+RAD;
  return Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)-RAD};
const zoneOf=(x,y)=>{const r=sdBox(x,y,RR[0]),g=sdBox(x,y,RR[1]);
  return Math.abs(r)<=6?'on-r':Math.abs(g)<=6?'on-g':r<0?'in-r':g<0?'in-g':'mid'};
function marblesRound(){
  const Z=[['in-r','μέσα στην κόκκινη γραμμή','inside the red line'],['in-g','μέσα στην πράσινη γραμμή','inside the green line'],['mid','ανάμεσα στις δύο γραμμές','between the two lines'],
    ['on-r','επάνω στην κόκκινη γραμμή','on the red line'],['on-g','επάνω στην πράσινη γραμμή','on the green line']];
  const[z,zel,zen]=pick(G.round<3?Z.slice(0,3):Z),n=1+rand(4);
  const q=tr(`Βάλε ${n} ${n===1?'βόλο':'βόλους'} ${zel}`,`Put ${n} ${n===1?'marble':'marbles'} ${zen}`);

   <svg class="marb" viewBox="0 0 200 120" aria-label="${q}">${RR.map((b,i)=>`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="${RAD}" fill="none" stroke="${i?'#4FA88A':'#E0604F'}" stroke-width="4"/>`).join('')}<g id="mg"></g></svg>
   <p class="counter" id="mmsg">${tr('Πάτησε για να βάλεις βόλο. Πάτησε ξανά τον βόλο για να τον βγάλεις.','Tap to put a marble. Tap a marble again to take it away.')}</p>
   <div class="row"><button class="pill main" id="mok">${tr('Έτοιμο','Done')}</button></div>`;
  const svg=stage().querySelector('.marb'),mg=$('mg'),M=[],COL=['#7EC8E3','#FFB677','#C9B6E8','#FFE08A','#9CCB86'];
  const draw=()=>{mg.innerHTML=M.map((m,i)=>`<circle cx="${m[0]}" cy="${m[1]}" r="7" fill="${COL[i%5]}" stroke="#2E2A4F" stroke-width="1.5"/>`).join('')};
  const add=(x,y)=>{const k=M.findIndex(m=>Math.hypot(m[0]-x,m[1]-y)<8);if(k>=0)M.splice(k,1);else M.push([x,y]);draw();tone([520],.06)};
  svg.onclick=e=>{if(busy)return;const[x,y]=svgPt(svg,e);add(x,y)};
  $('mok').onclick=()=>{if(busy)return;const inz=M.filter(m=>zoneOf(m[0],m[1])===z).length;
    if(inz===n&&M.length===n){busy=true;$('mmsg').textContent=PRAISE[S.lang];gr(PRAISE[S.lang]);win(marblesRound)}
    else{nope();const m=inz<n||M.length<n?tr(`Θέλω ${n} ${zel}.`,`I need ${n} ${zen}.`):tr('Έχεις βάλει βόλους σε λάθος μέρος ή παραπάνω.','Some marbles are in the wrong place or too many.');$('mmsg').textContent=m;gr(m)}};
  const spot={'in-r':[[47,45],[47,62],[47,79],[35,60]],'in-g':[[153,45],[153,62],[153,79],[165,60]],'mid':[[100,30],[100,50],[100,70],[100,90]],
    'on-r':[[40,16],[55,16],[40,104],[55,104]],'on-g':[[146,16],[161,16],[146,104],[161,104]]};
  G.solve=()=>{spot[z].slice(0,n).forEach(p=>add(p[0],p[1]));$('mok').click()};
  ask(q);
}

/* ch.3 p.16: how many times did the drum beat? */
function drumHit(){try{audio();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(55,t+.18);g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.32)}catch(e){}}
function drumRound(){
  const n=1+rand(5),q=tr('Πόσες φορές χτύπησε το ταμπουρίνο;','How many times did the drum beat?');let timer=[];
  stage().innerHTML=`<p class="prompt">${q}</p><button class="drum" id="drum" aria-label="${tr('Άκου ξανά','Listen again')}">🥁</button>
   <p class="counter">${tr('Πάτησε το ταμπουρίνο για να ακούσεις ξανά.','Tap the drum to hear it again.')}</p>
   <div class="opts c3">${btns(near(n,1,5))}</div>`;

  const path=[],draw=()=>{$('pond').innerHTML=[...Array(C*Rw)].map((_,i)=>{const x=i%C,y=i/C|0;return`<span>${x===f[0]&&y===f[1]?'🐸':x===t[0]&&y===t[1]&&(!ins||k===seq.length)?'🌼':''}</span>`}).join('');
    $('fpath').textContent=path.map(m=>MV[m][EN()?3:2]).join(', ')};

  set.filter(d=>d.length>1).forEach(d=>{p=p.split(d).join('')});return[...p].every(c=>set.includes(c))};

/* workbook mode: the child writes the answer on a keypad instead of picking it */
const KEYW=['letter','syl','join','missw','firstl','lastl'];let ABC='αβγδεζηθικλμνξοπρστυφχψω';
function writeIn(box,ans,ok){
  if(!(G&&G.o&&G.o.write)||!box)return;
  const opts=[...box.querySelectorAll('[data-v],[data-n]')],vals=opts.map(b=>b.dataset.v!==undefined?b.dataset.v:b.dataset.n);
  const num=vals.length>1&&vals.every(v=>/^\d{1,3}$/.test(v)),i=vals.indexOf(String(ans));
  if(i<0||!(num||(KEYW.indexOf(G.cur)>=0&&opts.every(b=>b.classList.contains('lett')))))return;
  const target=num?String(ans):plain(String(ans)),max=Math.min(num?3:6,target.length+(num?1:2));
  let keys;
  if(num)keys=['1','2','3','4','5','6','7','8','9','⌫','0','✓'];
  else{const have=plain(lset().join('')+target);keys=[...ABC].filter(c=>have.indexOf(c)>=0).concat(['⌫','✓'])}
  const wrap=document.createElement('div');wrap.className='kpad';
  wrap.innerHTML=`<p class="counter">${num?tr('Γράψε την απάντηση','Write the answer'):tr('Γράψε με τα γράμματα','Write it with the letters')}</p><div class="kout lett" id="kout"></div>
   <div class="keys${num?' kn':''}">${keys.map(k=>`<button data-k="${k}" class="${k==='✓'?'kok':k==='⌫'?'kx':''}" aria-label="${k==='✓'?tr('Έτοιμο','Done'):k==='⌫'?tr('Σβήνω','Delete'):k}">${k}</button>`).join('')}</div>`;
  box.hidden=true;box.parentNode.insertBefore(wrap,box.nextSibling);
  const out=wrap.querySelector('.kout');let typed='',wrong=0;const show=()=>{out.textContent=typed||' '};show();
  wrap.onclick=e=>{const b=e.target.closest('[data-k]');if(!b||busy)return;const k=b.dataset.k;
    if(k==='⌫'){typed=typed.slice(0,-1);show();return}
    if(k!=='✓'){if(typed.length<max){typed+=k;show();tone([500],.05)}return}
    if(!typed)return;
    if(typed===target){out.classList.add('ok');ok(opts[i])}
    else{out.classList.remove('no');void out.offsetWidth;out.classList.add('no');nope();typed='';show();
      // after two tries the choices come back, so nobody gets stuck
      if(++wrong>=2){wrap.parentNode.removeChild(wrap);box.hidden=false;gr(tr('Διάλεξε τη σωστή απάντηση','Choose the right answer'))}else gr(AGAIN[S.lang])}};
  G.solve=()=>{typed=target;wrap.querySelector('[data-k="✓"]').click()};
}

function tracelRound(){
  const set=lset(),nw=G.lvl&&G.lvl.nw,r=G.round;let t,e='',word=false;
  if(nw&&r<3)t=nw;else if(nw&&r<5)t=capL(nw);

    if(w){t=w.w;e=w.e;word=true}else{const sy=sylls(set).filter(x=>!nw||x.indexOf(nw)>=0);t=sy.length?pick(sy):nw||pick(set)}}
  const one=!word&&t.length<=2&&LNAME[t.toLowerCase()],sayIt=()=>say(one?LNAME[t.toLowerCase()]:t);
  const what=word?tr('τη λέξη','the word'):one?tr('το γράμμα','the letter'):tr('τη συλλαβή','the syllable');
  traceIn(t,`${tr('Γράφω','Write')} ${what} <span class="lett">${t}</span>`,e?`<div class="big-e">${e}</div>`:'',`${tr('Γράφω','Write')} ${what}`,sayIt,tracelRound,
    [tr('Γράψε με το δάχτυλο','Write with your finger')+' '+t,tr(`Πέρασε με το δάχτυλο πάνω από ${what}.`,`Trace over ${what} with your finger.`),tr(`Πέρασε πάνω από όλο ${what}.`,`Trace over all of ${what}.`),tr('Μείνε μέσα στις γραμμές.','Stay inside the lines.')]);

/* 7. drag & drop: drag an answer onto the gap, a letter onto the line, a word into the sentence */
(()=>{let drag=null,swallow=null;
  const dropT=()=>stage().querySelector('#gapbox,#slots,#sline');
  const near=(d,x,y)=>{const r=d.getBoundingClientRect();return x>r.left-30&&x<r.right+30&&y>r.top-30&&y<r.bottom+30};
  const down=(x,y,t)=>{if(!t||!t.closest||busy||!G||G.name==='map'||G.name==='page')return;const b=t.closest('#stage .opts [data-v],#stage .opts [data-n],#stage .inorder [data-n],#stage .letters button,#stage .wtiles button');
    if(!b||b.classList.contains('used')||b.closest('[hidden]')||!dropT())return;drag={b,x,y,g:null}};
  const move=(x,y,e)=>{if(!drag)return;
    if(!drag.g){if(Math.abs(x-drag.x)+Math.abs(y-drag.y)<10)return;const r=drag.b.getBoundingClientRect(),g=drag.b.cloneNode(true);g.classList.add('ghost');g.removeAttribute('id');
      g.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;z-index:20;pointer-events:none`;document.body.appendChild(g);drag.g=g;drag.ox=x-r.left;drag.oy=y-r.top}
    drag.g.style.left=(x-drag.ox)+'px';drag.g.style.top=(y-drag.oy)+'px';const d=dropT();if(d)d.classList.toggle('dropok',near(d,x,y));if(e&&e.cancelable)e.preventDefault()};
  const up=(x,y)=>{if(!drag)return;const{b,g}=drag;drag=null;if(!g)return;g.remove();const d=dropT();
    if(d){d.classList.remove('dropok');if(near(d,x,y)&&!busy)b.click()}swallow={b,t:Date.now()}};
  // the browser may still send a click to the dragged button: ignore it
  document.addEventListener('click',e=>{if(swallow&&Date.now()-swallow.t<500&&swallow.b.contains(e.target)&&e.isTrusted){e.stopPropagation();e.preventDefault();swallow=null}},true);
  if(window.PointerEvent){document.addEventListener('pointerdown',e=>{if(e.isPrimary)down(e.clientX,e.clientY,e.target)},true);
    document.addEventListener('pointermove',e=>move(e.clientX,e.clientY,e),{capture:true,passive:false});document.addEventListener('pointerup',e=>up(e.clientX,e.clientY),true);
    document.addEventListener('pointercancel',()=>{if(drag&&drag.g)drag.g.remove();drag=null},true)}
  else{const P=f=>e=>{const p=e.changedTouches[0];f(p.clientX,p.clientY,e)};document.addEventListener('touchstart',P((x,y,e)=>down(x,y,e.target)),{capture:true,passive:true});

/* ================= 1. Today's practice: a short daily mix built from what the child finds hard ================= */
const NOPRAC=['memory','learn','mix','map','page','tracel','trace','lines'];
const DGOAL=20;   // right answers a day fill the goal ring
// the letters the child already met in the reading book (current language)
const knownSet=()=>{let set=[];langAll().forEach(l=>{if(S.done[l.id]&&!l.rev&&l.b!=='✎')set=set.concat(l.mix[0][1].set)});
  set=set.filter((x,i)=>set.indexOf(x)===i);return set.length>=4?set:ALL};
function dailyMix(){
  const mix=[],ks=knownSet(),lv=f=>LANGG.indexOf(f)>=0?{set:ks}:undefined;
  // 1) the games with the lowest score (at least 3 tries)
  const acc=k=>{const g=S.gs[k];return g[0]/(g[0]+g[1])};
  Object.keys(S.gs).filter(k=>ROUNDS[k]&&NOPRAC.indexOf(k)<0&&S.gs[k][0]+S.gs[k][1]>=3&&acc(k)<.85).sort((a,b)=>acc(a)-acc(b)).slice(0,3)
    .forEach(k=>{mix.push([k,lv(k)]);mix.push([k,lv(k)])});
  // 2) letters that get mixed up: practise them side by side
  Object.keys(S.conf).sort((a,b)=>S.conf[b]-S.conf[a]).map(k=>k.split('→')).filter(([a,b])=>ALL.indexOf(a)>=0&&ALL.indexOf(b)>=0).slice(0,2)
    .forEach(([a,b])=>{const set=[a,b].concat(shuffle(ks.filter(x=>x!==a&&x!==b)).slice(0,3));mix.push(['letter',{set,nw:a}]);mix.push(['missw',{set,nw:b}])});
  // 3) a little review of lessons already finished (spaced repetition)
  const done=shuffle(langAll().filter(l=>S.done[l.id])).slice(0,2).concat(shuffle(mathAll().filter(c=>S.done[c[0]])).slice(0,2));
  done.forEach(l=>{const m=l.mix?pick(l.mix):pick(cmix(l));if(m&&NOPRAC.indexOf(m[0])<0)mix.push(m)});
  // 4) nothing played yet: start with the next lesson of each book
  if(mix.length<4){const nl=langAll().find(l=>!S.done[l.id]),nm=mathAll().find(c=>!S.done[c[0]]);
    if(nl)nl.mix.slice(0,4).forEach(m=>mix.push(m));if(nm)cmix(nm).forEach(m=>{if(NOPRAC.indexOf(m[0])<0)mix.push(m)})}
  return mix.length?mix:[['add'],['readw',{set:ALL}],['compare'],['missw',{set:ALL}]];
}
function startDaily(){start('mix',{daily:1,tt:tr('🎯 Η σημερινή εξάσκηση','🎯 Today\'s practice'),mix:dailyMix(),total:10})}
function renderDaily(){
  let d=$('daily');if(!d){d=document.createElement('div');d.id='daily';$('cont').parentNode.insertBefore(d,$('cont'))}
  const t=today(),p=Math.min(100,Math.round(t.r*100/DGOAL)),doneToday=S.dailyDone&&S.dailyDone[dkey()];
  d.innerHTML=`<button class="daily${doneToday?' did':''}" id="dailyBtn"><span class="ring" style="--p:${p}"><b>${doneToday?'✓':'🎯'}</b></span>
    <span><b>${doneToday?tr('Μπράβο! Έκανες τη σημερινή εξάσκηση','Well done! Today\'s practice is done'):tr('Η σημερινή εξάσκηση','Today\'s practice')}</b>
    <span>${tr(`5 λεπτά με ό,τι χρειάζεσαι · ⭐ ${t.r}/${DGOAL} σήμερα`,`5 minutes, just what you need · ⭐ ${t.r}/${DGOAL} today`)}</span></span><span class="go">▶</span></button>`;
  $('dailyBtn').onclick=startDaily;
}
renderCont=(f=>function(){f();renderDaily()})(renderCont);

/* ================= 3. Back up and move the progress; install on the home screen ================= */
const allKeys=()=>['hoopoe-kids'].concat(KPROF.list.map(k=>kidKey(k.id)));
function backupCode(){save();const data={};allKeys().forEach(k=>{const v=localStorage.getItem(k);if(v!==null)data[k]=v});
  return btoa(unescape(encodeURIComponent(JSON.stringify({app:'nisi',v:1,at:dkey(),data}))))}
function restoreFrom(code){
  let o;try{o=JSON.parse(decodeURIComponent(escape(atob(code.trim().replace(/\s/g,'')))))}catch(e){try{o=JSON.parse(code)}catch(e2){o=null}}
  if(!o||o.app!=='nisi'||!o.data){toast(tr('Ο κωδικός δεν είναι σωστός.','That code is not right.'));return}
  if(!confirm(tr('Να αντικατασταθεί η πρόοδος σε αυτή τη συσκευή με την αποθηκευμένη;','Replace the progress on this device with the saved one?')))return;
  try{Object.keys(o.data).forEach(k=>localStorage.setItem(k,o.data[k]))}catch(e){toast(tr('Δεν υπάρχει χώρος στη συσκευή.','No space on this device.'));return}
  location.reload();
}
let installEvt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});
const installed=()=>!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
const isIOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

        :`<li>${tr('Πατήστε το μενού <b>⋮</b> πάνω δεξιά στο Chrome','Tap the <b>⋮</b> menu at the top right of Chrome')}</li><li>${tr('Επιλέξτε <b>«Εγκατάσταση εφαρμογής»</b> ή <b>«Προσθήκη στην αρχική οθόνη»</b>','Choose <b>“Install app”</b> or <b>“Add to Home screen”</b>')}</li>`}</ul>`}</div>
   <div class="pcard"><h3>💾 ${tr('Αποθήκευση','Save')}</h3><p>${tr('Κρατήστε ένα αντίγραφο της προόδου όλων των παιδιών (αστέρια, μαθήματα, αυτοκόλλητα, νησί).','Keep a copy of every child\'s progress (stars, lessons, stickers, island).')}</p>
     <div class="row"><button class="pill main" id="bkFile">⬇️ ${tr('Αρχείο','File')}</button><button class="pill" id="bkCopy">📋 ${tr('Αντιγραφή κωδικού','Copy code')}</button></div>
     <textarea class="kname bkcode" id="bkOut" readonly rows="3" hidden></textarea></div>
   <div class="pcard"><h3>📥 ${tr('Επαναφορά ή μεταφορά σε άλλη συσκευή','Restore or move to another device')}</h3><p>${tr('Ανοίξτε το αρχείο ή επικολλήστε τον κωδικό στη νέα συσκευή.','Open the file or paste the code on the new device.')}</p>
     <div class="row"><label class="pill main" for="bkIn">📂 ${tr('Άνοιγμα αρχείου','Open file')}</label><input type="file" id="bkIn" accept=".json,.txt,application/json,text/plain" hidden></div>
     <textarea class="kname bkcode" id="bkPaste" rows="3" placeholder="${tr('Επικολλήστε εδώ τον κωδικό','Paste the code here')}"></textarea>
     <div class="row"><button class="pill" id="bkRestore">✅ ${tr('Επαναφορά','Restore')}</button></div></div>`;
  if($('instBtn'))$('instBtn').onclick=()=>{installEvt.prompt();installEvt.userChoice.then(()=>{installEvt=null;openBackup()},()=>{})};
  $('bkFile').onclick=()=>{const code=backupCode();try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'}));a.download=`nisi-${dkey()}.txt`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('💾 '+tr('Αποθηκεύτηκε!','Saved!'))}catch(e){$('bkOut').hidden=false;$('bkOut').value=code}};
  $('bkCopy').onclick=()=>{const code=backupCode(),o=$('bkOut');o.hidden=false;o.value=code;o.select();
    const ok=()=>toast('📋 '+tr('Ο κωδικός αντιγράφηκε. Στείλτε τον στον εαυτό σας (π.χ. email).','Code copied. Send it to yourself (e.g. email).'));
    try{navigator.clipboard.writeText(code).then(ok,()=>{document.execCommand('copy');ok()})}catch(e){try{document.execCommand('copy');ok()}catch(e2){}}};
  $('bkIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreFrom(String(r.result));r.readAsText(f)};
  $('bkRestore').onclick=()=>{const v=$('bkPaste').value;if(v.trim())restoreFrom(v)};
}

if('serviceWorker' in navigator){
  const hadCtl=!!navigator.serviceWorker.controller;let reloaded=false;
  // a new version took over: reload once so the phone shows it straight away
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl&&!reloaded){reloaded=true;location.reload()}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update()})}).catch(()=>{}));
}
